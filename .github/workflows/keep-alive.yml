name: Render Backend Keep Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render free-tier spin down (15 min inactivity limit)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-render:
    name: Ping Render Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP Ping
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://clinic-website-ndzj.onrender.com/api/health)
          echo "Health check HTTP response: $response"
          if [ "$response" != "200" ]; then
            echo "Warning: Health endpoint returned $response"
          fi
