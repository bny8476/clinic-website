server:
  port: ${PORT:8080}
  forward-headers-strategy: NATIVE

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: clinic-app
  flyway:
    enabled: false
  datasource:
    clinic:
      jdbc-url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE
      driver-class-name: org.h2.Driver
      username: sa
      password:
    pharmacy:
      jdbc-url: jdbc:h2:mem:pharmacydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE
      driver-class-name: org.h2.Driver
      username: sa
      password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: ${JWT_EXPIRATION_MS:900000} # 15 minutes

cors:
  # In production (Render), override via the ALLOWED_ORIGINS environment variable.
  # Set it to your Render frontend URL, e.g.: https://your-app.onrender.com
  # For multiple origins: https://your-app.onrender.com,http://localhost:5173
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:5174}

management:
  endpoints:
    web:
      exposure:
        include: health, info

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:mock}
  auth-token: ${TWILIO_AUTH_TOKEN:mock}
  from-number: ${TWILIO_FROM_NUMBER:mock}
  api-key-sid: ${TWILIO_API_KEY_SID:mock}
  api-key-secret: ${TWILIO_API_KEY_SECRET:mock}
  video:
    enabled: ${TWILIO_VIDEO_ENABLED:false}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

# PACS / DICOM (Orthanc) Configuration
orthanc:
  url: ${ORTHANC_URL:http://localhost:8042}
  username: ${ORTHANC_USERNAME:orthanc}
  password: ${ORTHANC_PASSWORD:orthanc}

# Gemini AI Configuration
gemini:
  api:
    key: ${GEMINI_API_KEY:mock_gemini_key}
    url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:pk_test_placeholder}
