spring:
  datasource:
    url: "jdbc:h2:mem:flyway_isolated_val_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE;INIT=CREATE DOMAIN IF NOT EXISTS JSONB AS JSON"
    username: sa
    password: ""
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration/clinic,classpath:db/migration/pharmacy
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate

app:
  datasource:
    clinic:
      url: "jdbc:h2:mem:flyway_isolated_val_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE;INIT=CREATE DOMAIN IF NOT EXISTS JSONB AS JSON"
      username: sa
      password: ""

ecommerce:
  payment:
    provider: MOCK
    mode: TEST
    allow-mock: true
