spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
app:
  flyway:
    baseline-on-migrate: true
    baseline-version-clinic: "114"
    baseline-version-pharmacy: "112"
  datasource:
    clinic:
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      minimum-idle: 1
      maximum-pool-size: 5
