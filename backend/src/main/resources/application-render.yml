spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=600s

  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  flyway:
    baseline-on-migrate: true
    baseline-version-clinic: "0"

  datasource:
    clinic:
      connection-timeout: 10000
      validation-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      minimum-idle: 2
      maximum-pool-size: 6

server:
  tomcat:
    threads:
      max: 10
      min-spare: 5
    max-connections: 100

twilio:
  account-sid: mock
  auth-token: mock
  from-number: mock
  api-key-sid: mock
  api-key-secret: mock
  video:
    enabled: false

aws:
  enabled: false
  access-key: mock
  secret-key: mock
  region: us-east-1
  s3:
    bucket: mock-bucket

stripe:
  secret-key: sk_test_placeholder
  webhook-secret: whsec_placeholder
  publishable-key: pk_test_placeholder

gemini:
  api:
    key: ${GEMINI_API_KEY:mock_gemini_key}
    url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent}
