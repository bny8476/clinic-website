spring:
  flyway:
    enabled: false
  main:
    allow-bean-definition-overriding: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
app:
  datasource:
    clinic:
      jdbc-url: jdbc:h2:mem:clinicdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
      driver-class-name: org.h2.Driver
      username: sa
      password: password
    pharmacy:
      jdbc-url: jdbc:h2:mem:pharmacydb;MODE=MySQL;DATABASE_TO_LOWER=TRUE
      driver-class-name: org.h2.Driver
      username: sa
      password: password

jwt:
  secret: default_dev_secret_key_that_is_long_enough_for_hs256_algorithm_12345
  access-token-expiration-ms: 86400000

stripe:
  secret-key: sk_test_dev_placeholder_not_real
  webhook-secret: whsec_dev_placeholder_not_real
  publishable-key: pk_test_dev_placeholder_not_real

twilio:
  account-sid: ACdev0000000000000000000000000000
  auth-token: dev_placeholder_auth_token
  from-number: "+10000000000"
